name: Build and deploy PaarFinanzen PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild project archive
        shell: bash
        run: |
          cat bundle/part*.b64 | base64 --decode > project.zip

          # Im ursprünglichen Archiv steht nur im lokalen ZIP-Header
          # "tashboard_page.dart", während das zentrale Verzeichnis bereits
          # korrekt "dashboard_page.dart" enthält. Beide Namen sind gleich lang,
          # daher kann der Header verlustfrei binär korrigiert werden.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("project.zip")
          data = path.read_bytes()
          wrong = b"tashboard_page.dart"
          correct = b"dashboard_page.dart"
          count = data.count(wrong)
          if count != 1:
              raise SystemExit(f"Erwartete genau einen falschen ZIP-Dateinamen, gefunden: {count}")
          path.write_bytes(data.replace(wrong, correct))
          PY

          mkdir -p extracted
          unzip -q project.zip -d extracted
          test -f extracted/paarfinanzen_flutter_pwa/lib/ui/dashboard_page.dart

      - name: Patch Flutter Category name conflict
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("extracted/paarfinanzen_flutter_pwa/lib/finance_store.dart")
          text = path.read_text(encoding="utf-8")
          old = "import 'package:flutter/foundation.dart';"
          new = "import 'package:flutter/foundation.dart' hide Category;"
          if old not in text and new not in text:
              raise SystemExit("Expected Flutter foundation import not found")
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: extracted/paarfinanzen_flutter_pwa
        run: flutter pub get

      - name: Tests
        working-directory: extracted/paarfinanzen_flutter_pwa
        run: flutter test

      - name: Build web
        working-directory: extracted/paarfinanzen_flutter_pwa
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: extracted/paarfinanzen_flutter_pwa/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

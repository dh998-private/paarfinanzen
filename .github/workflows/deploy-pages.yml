name: Build and publish PaarFinanzen PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild clean Flutter project
        shell: bash
        run: |
          cat bundle-v2/part*.b64 | base64 --decode > project.tar.gz
          mkdir -p extracted
          tar -xzf project.tar.gz -C extracted
          test -f extracted/paarfinanzen_flutter_pwa/lib/ui/dashboard_page.dart
          test -f extracted/paarfinanzen_flutter_pwa/lib/ui/bookings_page.dart

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: extracted/paarfinanzen_flutter_pwa
        run: flutter pub get

      - name: Tests
        working-directory: extracted/paarfinanzen_flutter_pwa
        run: flutter test

      - name: Build web
        working-directory: extracted/paarfinanzen_flutter_pwa
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./extracted/paarfinanzen_flutter_pwa/build/web
          publish_branch: gh-pages
          force_orphan: true
